# Perturbation texts for `agentaudit perturb`. Hash-frozen with the protocol.
# inject: canonical sentence(s) that meet the level-2 anchor on their own (all elements present).
# paraphrase: meaning-preserving rewrite of inject.
# decoy: looks relevant but fails the anchor (expected: no rise above the base level).
# Texts are benchmark-neutral and contain no benchmark names.
# 2026-10-05: paraphrase texts re-authored by qwen/qwen3.8-27b (Groq), a non-coder family (design review T2); inject canonical; decoys kept from the Opus-reviewed set because qwen decoys met level-1 anchors for C2,C4,C8,C11,C12,A2,A6,A7,A9,A10,A11.
items:
  C1:
    inject: The tasks are drawn from the clinical database MIMIC-IV version 2.2 (snapshot released in January 2023,
      hosted on PhysioNet), and every task record stores the identifier of its source patient record, so any task
      can be traced back to its origin.
    paraphrase: Task data originates from MIMIC-IV v2.2, a PhysioNet snapshot from January 2023. Each task record
      preserves the source patient identifier, enabling complete traceability from any task back to its underlying
      patient record.
    decoy: Task content was derived from clinical records of the kind found in hospital databases.
  C2:
    inject: All patient records originate from a de-identified hospital database collected during routine care between
      2008 and 2019. The data are released under a credentialed-access data use agreement, and the source institution's
      review board determined that the study qualified for a waiver of consent.
    paraphrase: The source database consists of de-identified patient records collected between 2008 and 2019 from
      routine hospital care. Distribution follows a credentialed data use agreement, and the originating institution's
      IRB approved a consent waiver for this research.
    decoy: The data come from clinical sources and are intended for research use.
  C3:
    inject: To assess representativeness, we compared the age, sex and race distribution of the benchmark patients
      against the U.S. adult inpatient population reported in a national hospital discharge survey, and found differences
      of under five percentage points in every category.
    paraphrase: Representativeness was evaluated by comparing the benchmark population's age, sex, and racial composition
      to the U.S. adult hospitalized population as reported by a national discharge survey; all categories showed
      variation under 5%.
    decoy: The patient cases were chosen to cover a diverse range of conditions.
  C4:
    inject: The benchmark includes a safety test suite that measures unsafe outputs such as contraindicated medication
      orders, and a separate bias test that compares agent accuracy across patient demographic groups.
    paraphrase: Safety testing identifies unsafe outputs like contraindicated medications; bias testing compares
      accuracy across different patient demographics. Both test suites are built into the benchmark.
    decoy: We hope the benchmark will encourage the development of safe and fair clinical agents.
  C5:
    inject: To limit contamination, the test split is held out and distributed only through gated access, and we
      measured verbatim overlap between the test tasks and a public web corpus, finding no exact matches.
    paraphrase: Contamination mitigation includes gating access to the test split. Measurement of verbatim overlap
      with public web corpora revealed zero exact matches between test tasks and public sources.
    decoy: Data contamination is a potential concern for all benchmarks of this kind.
  C6:
    inject: 'The agent cannot reach ground-truth answers at run time: the answer labels are stored in a separate
      evaluation service that has no network path from the agent sandbox, and they are not published in the repository.'
    paraphrase: 'Ground truth is isolated from runtime agent access: labels reside in an independent evaluation
      service disconnected from the agent sandbox with no network route, and the repository does not publish them.'
    decoy: Ground-truth answers are used by the evaluator to compute scores after each episode.
  C7:
    inject: 'The environment is frozen at release: the database snapshot, the software image and the simulated-patient
      language model are all pinned to fixed versions, and no external service is called at evaluation time other
      than the model under test.'
    paraphrase: 'Environment components are fixed at release: database snapshot, software image, and patient-simulation
      LLM are each version-pinned. During evaluation, only the model under test is called; no other external services
      are involved.'
    decoy: The environment code and task files are publicly available in the project repository.
  C8:
    inject: To confirm that every task is solvable, we ran a scripted reference solution for each task through the
      grader; all 120 reference solutions were graded correct.
    paraphrase: Solvability was confirmed by executing a scripted reference solution for every task through the
      grader. All 120 reference implementations received correct grades.
    decoy: Tasks were written by the authors on the basis of published clinical guidelines.
  C9:
    inject: The grader checks both the intended state changes and that all other records remain unchanged, so out-of-scope
      modifications are detected and counted as failures.
    paraphrase: Grading validates both intended state modifications and preservation of unrelated records. Any unintended
      changes are caught and scored as failures.
    decoy: The grader checks whether the final answer matches the expected value.
  C10:
    inject: A random-action agent succeeds on 3.1% of tasks, and the chance success rate for each metric is reported
      in the appendix.
    paraphrase: Random-action agents achieve 3.1% success across tasks. Appendix tables document baseline success
      rates for each metric.
    decoy: Models are compared on accuracy.
  C11:
    inject: A do-nothing agent that issues no actions scores 0.0% on all 120 tasks, and a random agent scores 2.5%
      on the same tasks.
    paraphrase: Across all 120 tasks, an agent with no actions scores 0.0%, while a random-action agent achieves
      2.5%.
    decoy: We also report a baseline in which the same language model answers without access to any tools.
  C12:
    inject: We validated the automatic evaluator on 200 outputs labelled by two physicians; agreement was 94%, with
      a false-positive rate of 3% and a false-negative rate of 8%.
    paraphrase: The evaluator was validated against 200 physician-labeled outputs. Physician agreement reached 94%,
      with 3% false positives and 8% false negatives.
    decoy: The evaluator uses a language model to compare each answer with the reference.
  C13:
    inject: All runs use temperature 0 and a fixed random seed, and each task is run three times; this repeated-run
      policy is described in the main text.
    paraphrase: Every run applies temperature 0 with a fixed seed. The main text describes the policy of executing
      each task three times.
    decoy: Results may vary slightly between runs because language model outputs are not fully deterministic.
  C14:
    inject: We report 95% bootstrap confidence intervals for all model scores and test the difference between the
      two best models with a paired permutation test (p = 0.02).
    paraphrase: Model scores include 95% bootstrap confidence intervals. Statistical testing of the two top-performing
      models employed paired permutation testing with p = 0.02.
    decoy: Model A scored 61.2% and model B scored 58.9%.
  A1:
    inject: Each task was run five times per model with independent random seeds; the temperature was set to 0.7,
      and the reported scores are means over the five independent runs.
    paraphrase: For each model, five independent runs per task employed separate random seeds at temperature 0.7.
      Reported scores represent the mean of these five independent runs.
    decoy: Experiments were repeated multiple times.
  A2:
    inject: We report 95% confidence intervals computed by bootstrapping over tasks, so the resampling unit is the
      task; where several tasks share a patient, we resample patients instead to account for clustering.
    paraphrase: Headline scores carry 95% bootstrap CIs where the resampling unit is the task. When multiple tasks
      share a patient, the bootstrap resamples patients to address within-patient clustering.
    decoy: Results show small variance across settings.
  A3:
    inject: To measure reliability, we ran each task eight times and report pass^8, the fraction of tasks solved
      in all eight runs, together with the agreement of the final environment state across the eight runs.
    paraphrase: 'Reliability measurement: each task executed eight times. We report pass^8 (share of tasks solved
      in all 8 runs) and agreement rates of the final environment state across these eight runs.'
    decoy: Our results were obtained from a single run of each model.
  A4:
    inject: Models were queried through their APIs using the snapshot identifiers gpt-4o-2024-08-06 and claude-3-5-sonnet-20241022,
      with temperature 0 and a maximum of 2,048 output tokens; all reported numbers correspond to harness release
      v1.2.0.
    paraphrase: API calls used snapshot IDs gpt-4o-2024-08-06 and claude-3-5-sonnet-20241022 with temperature 0
      and 2,048-token output ceiling. All reported results match harness version v1.2.0.
    decoy: We evaluated GPT-4 and Claude as agents.
  A5:
    inject: Each tool is defined by a JSON schema listing its name, arguments and argument types. The documentation
      states for every tool whether it only reads or also writes state, and describes what each tool returns, including
      the error message returned for invalid arguments. These tool descriptions are included in the agent prompt.
    paraphrase: Tools are specified using JSON schemas with name, arguments, and types. Documentation for each tool
      declares whether it reads or modifies state and describes return values, including error messages for invalid
      arguments. Agent prompts include these tool descriptions.
    decoy: The agent can use tools to interact with the environment.
  A6:
    inject: We ran conformance tests confirming that each tool behaves as documented. Two tools are simulated stubs
      that return fixed placeholder responses; this is disclosed in the paper and also stated in the tool descriptions
      shown to the agent.
    paraphrase: Conformance testing confirms tool behavior matches documentation. Two tools consist of simulated
      stubs providing fixed placeholder responses. This is disclosed both in the paper and in the tool descriptions
      visible to the agent.
    decoy: The tools were implemented by the authors.
  A7:
    inject: The write actions that change patient state (medication orders, notes and messages) are listed in a
      table. Writes are executed against a sandboxed copy of the record, and unnecessary or unsafe writes are penalised
      in the score. The agent prompt states that writes are sandboxed.
    paraphrase: 'A table enumerates write actions affecting patient state: orders, notes, and messages. These execute
      on a sandboxed record copy. Scores penalize unnecessary or unsafe writes. The agent prompt discloses sandboxing.'
    decoy: The agent interacts with a simulated hospital environment.
  A8:
    inject: The grader takes the final environment state as its input. We validated the grader on 150 injected correct
      and incorrect outcomes, finding a false-accept rate of 1% and a false-reject rate of 2%.
    paraphrase: Grading operates on the final environment state. Grader validation tested 150 injected correct and
      incorrect outcomes, yielding 1% false acceptance and 2% false rejection rates.
    decoy: Scores are reported as percentages.
  A9:
    inject: Agents have no web access during runs and retrieval tools are restricted to the task environment, so
      answers cannot leak through external search. A private held-out split with hidden labels is kept off all public
      surfaces, and every released task carries a canary string.
    paraphrase: Web access is blocked during runs; retrieval is confined to the task environment, preventing answer
      leakage through search. A private held-out test split with concealed labels is excluded from all public surfaces.
      Released tasks include a canary string.
    decoy: We acknowledge that leakage of benchmark data into training sets is possible.
  A10:
    inject: We report accuracy per task family (diagnosis, ordering and documentation tasks) and per patient subgroup
      by sex and race, and each table lists the number of cases in every slice.
    paraphrase: Accuracy is reported by task family (diagnosis, ordering, documentation) and by patient subgroup
      (sex, race), with case counts displayed for every slice in the tables.
    decoy: We report overall accuracy over all tasks.
  A11:
    inject: The patient records are real de-identified records from a hospital database. Their use was approved
      under a data use agreement requiring credentialed access and de-identification by the safe harbour method,
      and the data are released under terms separate from the MIT code licence.
    paraphrase: The patient records utilized are genuine, de-identified entries sourced from a hospital database.
      Their usage was authorized via a data use agreement that mandated credentialed access and de-identification
      compliant with the safe harbour method. Additionally, the data are distributed under terms distinct from the
      MIT code licence.
    decoy: The environment contains patient records.
